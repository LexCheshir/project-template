[project]
name = "project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LexCheshir", email = "" }
]
requires-python = ">=3.12"

dependencies = [
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
project-template = "project_template.entrypoints.embed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

